[project]
name = "event-driven-data-mesh"
version = "0.1.0"
description = "Event-Driven Data Product Architecture prototype (Data Mesh)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiokafka>=0.12",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datamesh"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]